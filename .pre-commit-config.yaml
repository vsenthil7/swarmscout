repos:
  - repo: https://github.com/Yelp/detect-secrets
    rev: v1.5.0
    hooks:
      - id: detect-secrets
        args: ["--baseline", ".secrets.baseline"]
        exclude: "(^\\.env\\.example$|^docs/|pnpm-lock\\.yaml|package-lock\\.json)"

  - repo: https://github.com/astral-sh/ruff-pre-commit
    rev: v0.4.4
    hooks:
      - id: ruff
        args: [--fix]
      - id: ruff-format

  - repo: https://github.com/pre-commit/pre-commit-hooks
    rev: v4.6.0
    hooks:
      - id: trailing-whitespace
      - id: end-of-file-fixer
      - id: check-yaml
      - id: check-toml
      - id: check-added-large-files
      - id: check-merge-conflict
      - id: no-commit-to-branch
        args: ["--branch", "main"]

  - repo: local
    hooks:
      - id: no-demo-phrase
        name: No "for demo purposes" phrase (NFR-382)
        entry: bash -c 'if grep -rniI --exclude-dir=node_modules --exclude-dir=.git --exclude-dir=.venv --exclude-dir=out --exclude-dir=coverage "for demo purposes" . ; then echo "Forbidden phrase found"; exit 1; fi'
        language: system
        pass_filenames: false

      - id: biome-format
        name: Biome format
        entry: pnpm biome format --write
        language: system
        files: '\.(ts|tsx|js|jsx|json)$'
        pass_filenames: true
        exclude: '^web/lib/schemas/generated/'
