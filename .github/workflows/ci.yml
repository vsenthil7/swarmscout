name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

env:
  PYTHON_VERSION: "3.12"
  NODE_VERSION: "20"

jobs:
  grep-forbidden-phrases:
    name: No forbidden phrases (NFR-382)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Grep for "for demo purposes"
        run: |
          if grep -rniI \
              --exclude-dir=node_modules \
              --exclude-dir=.git \
              --exclude-dir=out \
              --exclude-dir=coverage \
              "for demo purposes" . ; then
            echo "::error::Forbidden phrase 'for demo purposes' found"
            exit 1
          fi

  python:
    name: Python lint, type-check, test
    runs-on: ubuntu-latest
    services:
      redis:
        image: redis:7.2-alpine
        ports: ["6379:6379"]
        options: >-
          --health-cmd "redis-cli ping"
          --health-interval 5s
          --health-timeout 3s
          --health-retries 10
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_USER: swarmscout
          POSTGRES_PASSWORD: swarmscout
          POSTGRES_DB: swarmscout
        ports: ["5432:5432"]
        options: >-
          --health-cmd "pg_isready -U swarmscout"
          --health-interval 5s
          --health-timeout 3s
          --health-retries 10

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v6
        with:
          python-version: ${{ env.PYTHON_VERSION }}
          cache: "pip"

      - name: Install
        run: |
          python -m pip install --upgrade pip
          pip install -e ".[dev]"

      - name: Ruff (lint)
        run: ruff check .

      - name: Ruff (format check)
        run: ruff format --check .

      - name: Mypy strict
        run: mypy agents api bot

      - name: Apply Postgres schema
        env:
          PGPASSWORD: swarmscout
        run: |
          psql -h localhost -U swarmscout -d swarmscout -f infra/postgres-init.sql

      - name: Pytest with 100% coverage gate
        env:
          REDIS_URL: redis://localhost:6379/0
          POSTGRES_DSN: postgresql+asyncpg://swarmscout:swarmscout@localhost:5432/swarmscout
          ENV: ci
        run: pytest

      - name: Schema drift gate (TC-I11)
        run: |
          python scripts/export_schemas.py
          if ! git diff --exit-code web/lib/schemas/generated/ ; then
            echo "::error::Pydantic schemas drifted from committed copy"
            exit 1
          fi

      - name: Upload coverage
        uses: actions/upload-artifact@v4
        with:
          name: coverage-python
          path: coverage.xml

  typescript:
    name: TypeScript / Next.js
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: web
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
      - name: Enable corepack / pnpm
        run: corepack enable
      - name: Install
        run: pnpm install --no-frozen-lockfile
      - name: Biome lint
        run: pnpm biome check .
      - name: Typecheck
        run: pnpm typecheck
      - name: Vitest with 100% coverage
        run: pnpm test -- --coverage
