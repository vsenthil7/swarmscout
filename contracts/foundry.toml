[profile.default]
src = "src"
out = "out"
libs = ["lib"]
solc_version = "0.8.24"
optimizer = true
optimizer_runs = 200
via_ir = true
evm_version = "shanghai"

[profile.default.fuzz]
runs = 1000
max_test_rejects = 65536

[profile.default.invariant]
runs = 256
depth = 32
fail_on_revert = false
call_override = false

[rpc_endpoints]
bsc_testnet = "${BNB_TESTNET_RPC_URL}"
bsc_mainnet = "https://bsc-dataseed.binance.org"

[etherscan]
bsc_testnet = { key = "${BSCSCAN_API_KEY}", url = "https://api-testnet.bscscan.com/api", chain = 97 }

[fmt]
line_length = 100
tab_width = 4
bracket_spacing = true
