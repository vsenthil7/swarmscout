[build-system]
requires = ["hatchling>=1.21"]
build-backend = "hatchling.build"

[project]
name = "swarmscout"
version = "0.1.0"
description = "Decentralised agent swarm for Four.meme alpha discovery"
readme = "README.md"
requires-python = ">=3.12,<3.13"
license = { text = "MIT" }
authors = [{ name = "Senthil" }]
dependencies = [
    "pydantic>=2.6",
    "pydantic-settings>=2.2",
    "redis[hiredis]>=5.0",
    "httpx>=0.27",
    "aiogram>=3.5",
    "fastapi>=0.111",
    "uvicorn[standard]>=0.30",
    "asyncpg>=0.29",
    "sqlalchemy[asyncio]>=2.0",
    "alembic>=1.13",
    "python-ulid>=2.2",
    "eth-account>=0.11",
    "web3>=6.15",
    "prometheus-client>=0.20",
    "structlog>=24.1",
    "orjson>=3.10",
    "tenacity>=8.2",
    "playwright>=1.44",
    "beautifulsoup4>=4.12",
    "anthropic>=0.25",
    "openai>=1.30",
    "google-genai>=0.3",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.1",
    "pytest-asyncio>=0.23",
    "pytest-cov>=5.0",
    "pytest-mock>=3.12",
    "pytest-httpx>=0.30",
    "pytest-timeout>=2.3",
    "fakeredis>=2.23",
    "testcontainers[postgres,redis]>=4.4",
    "ruff>=0.4",
    "mypy>=1.10",
    "types-redis>=4.6",
    "pre-commit>=3.7",
    "detect-secrets>=1.5",
    "hypothesis>=6.100",
    "freezegun>=1.5",
    "respx>=0.21",
]

[project.scripts]
swarmscout-hunter = "agents.hunter.main:run"
swarmscout-social = "agents.social.main:run"
swarmscout-chain = "agents.chain.main:run"
swarmscout-risk = "agents.risk.main:run"
swarmscout-narrator = "agents.narrator.main:run"
swarmscout-api = "api.main:run"
swarmscout-bot = "bot.main:run"

[tool.hatch.build.targets.wheel]
packages = ["agents", "api", "bot"]

[tool.pytest.ini_options]
minversion = "8.0"
testpaths = ["tests", "agents", "api", "bot"]
asyncio_mode = "auto"
addopts = [
    "-ra",
    "--strict-markers",
    "--strict-config",
    "--cov=agents",
    "--cov=api",
    "--cov=bot",
    "--cov-branch",
    "--cov-report=term-missing",
    "--cov-report=xml",
    "--cov-fail-under=100",
]
markers = [
    "integration: requires live Redis/Postgres via testcontainers",
    "contract: requires Anvil or BNB Testnet RPC",
    "e2e: end-to-end via Playwright",
    "slow: takes >5s",
]

[tool.coverage.run]
branch = true
source = ["agents", "api", "bot"]
omit = [
    "*/tests/*",
    "*/__main__.py",
]

[tool.coverage.report]
exclude_lines = [
    "pragma: no cover",
    "raise NotImplementedError",
    "if TYPE_CHECKING:",
    "if __name__ == .__main__.:",
]
show_missing = true
skip_covered = false
fail_under = 100

[tool.ruff]
line-length = 100
target-version = "py312"
extend-exclude = ["contracts/lib"]

[tool.ruff.lint]
select = [
    "E", "F", "W",   # pycodestyle + pyflakes
    "I",             # isort
    "N",             # pep8-naming
    "UP",            # pyupgrade
    "B",             # bugbear
    "A",             # builtins
    "C4",            # comprehensions
    "SIM",           # simplify
    "PTH",           # pathlib
    "RUF",           # ruff-specific
    "ASYNC",         # async correctness
    "S",             # bandit
]
ignore = [
    "S101",  # assert (used in tests)
    "S311",  # pseudo-random ok for non-crypto
]

[tool.ruff.lint.per-file-ignores]
"tests/**" = ["S", "N"]
"agents/*/tests/**" = ["S", "N"]

[tool.ruff.format]
quote-style = "double"
indent-style = "space"

[tool.mypy]
python_version = "3.12"
strict = true
warn_unused_configs = true
disallow_untyped_defs = true
disallow_incomplete_defs = true
check_untyped_defs = true
disallow_untyped_decorators = false
no_implicit_optional = true
warn_redundant_casts = true
warn_unused_ignores = true
warn_return_any = true
no_implicit_reexport = true
strict_equality = true
plugins = ["pydantic.mypy"]
exclude = ['^contracts/', '^web/']

[[tool.mypy.overrides]]
module = ["tests.*"]
disallow_untyped_defs = false
