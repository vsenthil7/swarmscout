version: "3.9"

# ============================================================================
# SwarmScout local / single-VPS compose.
# Redis = message bus; Postgres = full payloads + LLM call log; one service
# per agent, plus API, bot, dashboard, Anvil for contract testing.
# ============================================================================

x-python-base: &python-base
  build:
    context: .
    dockerfile: infra/Dockerfile.python
  env_file: .env
  depends_on:
    redis:
      condition: service_healthy
    postgres:
      condition: service_healthy
  restart: unless-stopped

services:
  redis:
    image: redis:7.2-alpine
    command: ["redis-server", "--appendonly", "yes", "--appendfsync", "everysec"]
    volumes:
      - redis-data:/data
    ports:
      - "6379:6379"
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 10

  postgres:
    image: postgres:16-alpine
    environment:
      POSTGRES_USER: swarmscout
      POSTGRES_PASSWORD: swarmscout
      POSTGRES_DB: swarmscout
    volumes:
      - pg-data:/var/lib/postgresql/data
      - ./infra/postgres-init.sql:/docker-entrypoint-initdb.d/init.sql:ro
    ports:
      - "5432:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U swarmscout -d swarmscout"]
      interval: 5s
      timeout: 3s
      retries: 10

  hunter:
    <<: *python-base
    command: ["python", "-m", "agents.hunter.main"]

  social:
    <<: *python-base
    command: ["python", "-m", "agents.social.main"]

  chain:
    <<: *python-base
    command: ["python", "-m", "agents.chain.main"]

  risk:
    <<: *python-base
    command: ["python", "-m", "agents.risk.main"]

  narrator:
    <<: *python-base
    command: ["python", "-m", "agents.narrator.main"]

  api:
    <<: *python-base
    command: ["uvicorn", "api.main:app", "--host", "0.0.0.0", "--port", "8000"]
    ports:
      - "8000:8000"

  bot:
    <<: *python-base
    command: ["python", "-m", "bot.main"]

  web:
    build:
      context: ./web
      dockerfile: ../infra/Dockerfile.web
    env_file: .env
    environment:
      - NEXT_PUBLIC_API_URL=http://api:8000
    ports:
      - "3000:3000"
    depends_on:
      - api
    restart: unless-stopped

volumes:
  redis-data:
  pg-data:
