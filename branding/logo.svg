<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="512" height="512">
  <title>SwarmScout logo</title>
  <defs>
    <!-- background gradient -->
    <linearGradient id="bg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0B0F1A"/>
      <stop offset="100%" stop-color="#121A33"/>
    </linearGradient>
    <!-- accent gradient used on the swarm ring -->
    <linearGradient id="accent" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#60A5FA"/>
      <stop offset="50%" stop-color="#A78BFA"/>
      <stop offset="100%" stop-color="#F472B6"/>
    </linearGradient>
    <!-- soft glow under the central node -->
    <radialGradient id="glow" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#A78BFA" stop-opacity="0.55"/>
      <stop offset="60%" stop-color="#A78BFA" stop-opacity="0.08"/>
      <stop offset="100%" stop-color="#A78BFA" stop-opacity="0"/>
    </radialGradient>
  </defs>

  <!-- rounded background -->
  <rect x="0" y="0" width="512" height="512" rx="92" ry="92" fill="url(#bg)"/>

  <!-- ambient glow -->
  <circle cx="256" cy="256" r="180" fill="url(#glow)"/>

  <!-- outer ring representing the swarm orbit -->
  <circle cx="256" cy="256" r="168" fill="none" stroke="url(#accent)" stroke-width="4" stroke-opacity="0.55"/>

  <!-- connection lines from centre to each agent -->
  <g stroke="url(#accent)" stroke-width="2" stroke-opacity="0.45">
    <line x1="256" y1="256" x2="256" y2="88"/>
    <line x1="256" y1="256" x2="406" y2="164"/>
    <line x1="256" y1="256" x2="396" y2="358"/>
    <line x1="256" y1="256" x2="116" y2="358"/>
    <line x1="256" y1="256" x2="106" y2="164"/>
  </g>

  <!-- 5 satellite agents (Hunter, Social, Chain, Risk, Narrator) -->
  <g>
    <circle cx="256" cy="88"  r="22" fill="#60A5FA"/>
    <circle cx="406" cy="164" r="22" fill="#A78BFA"/>
    <circle cx="396" cy="358" r="22" fill="#F472B6"/>
    <circle cx="116" cy="358" r="22" fill="#5EEAD4"/>
    <circle cx="106" cy="164" r="22" fill="#FBBF24"/>
  </g>

  <!-- central node with hex chain motif -->
  <circle cx="256" cy="256" r="56" fill="#0B1228" stroke="url(#accent)" stroke-width="4"/>
  <!-- tiny chain-link icon inside -->
  <g transform="translate(256 256)" stroke="url(#accent)" stroke-width="6" fill="none" stroke-linecap="round">
    <path d="M -22 -10 a 14 14 0 0 1 14 -14 h 8"/>
    <path d="M 22 10 a 14 14 0 0 1 -14 14 h -8"/>
    <line x1="-8" y1="-10" x2="8" y2="10"/>
  </g>

  <!-- wordmark -->
  <text x="256" y="470"
        text-anchor="middle"
        font-family="Segoe UI, Helvetica, Arial, sans-serif"
        font-size="42"
        font-weight="700"
        letter-spacing="2"
        fill="url(#accent)">SwarmScout</text>
</svg>
